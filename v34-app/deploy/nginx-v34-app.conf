# nginx для продукта V3.4.
# Ставится в /etc/nginx/sites-available/v34-app.conf, симлинк в sites-enabled.
#
# ШАБЛОН. `__DOMAIN__` подставляет deploy/install.sh (--domain). Вручную:
#   sed "s|__DOMAIN__|ваш.домен.fi|g" nginx-v34-app.conf > /etc/nginx/sites-available/v34-app.conf
#
# Конфиг рассчитан на УЖЕ выпущенный сертификат: ссылки на несуществующие
# файлы в /etc/letsencrypt/live/__DOMAIN__/ ломают `nginx -t`, поэтому
# install.sh сначала поднимает HTTP-only конфиг для ACME, выпускает
# сертификат и только потом включает этот файл.
#
# Приложение ходит на /api/v1/*, лендинг и APK отдаёт тот же сервер.

upstream v34_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME-challenge и продление сертификата (http-01, webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Никакого API по открытому HTTP: до появления сертификата порт 80
    # обслуживает только ACME, всё остальное — редирект на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # Пути выставляет certbot --webroot/--nginx; пример для ручной установки.
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 2m;

    # Регистрация устройств: ограничение на IP, чтобы не заливали БД токенами.
    location = /api/v1/devices {
        limit_req zone=devices burst=10 nodelay;
        proxy_pass http://v34_app;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://v34_app;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://v34_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # APK: только скачивание, без кэша манифеста.
    location /apk/ {
        proxy_pass http://v34_app;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /var/log/nginx/v34-app.access.log;
    error_log  /var/log/nginx/v34-app.error.log;
}
