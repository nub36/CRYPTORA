name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Typecheck + Unit + Build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — нужен origin/main для guard «миграции 001–005 не изменялись»
      # в tests/integration/migrationsPostgres.test.ts. С дефолтным depth=1 checkout
      # не создаёт origin/main, и проверка сравнивать не с чем.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-e2e:
    name: Browser e2e (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e (capture output)
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Логи/артефакты недоступны из части сред — дублируем причину падения в аннотации
      # check-run (читаются через API без blob-хранилища).
      #
      # Отбор строгий, иначе нужное вытесняется шумом:
      #   ✗ [WebServer] — vite dev печатает ECONNREFUSED на каждую недоступную с
      #     CI-раннера биржу (сотни строк);
      #   ✗ «✓ … passed» — список пройденших тестов от list-reporter;
      #   ✗ «Error Context: …/error-context.md» — путь к контексту, не причина.
      # Остаются: ✘ (упавшие тесты), строки «N failed», «Error name/value/source»,
      # ассерты и хвосты «at …» с номерами строк спеков.
      - name: Emit e2e failure details as annotations
        if: failure()
        shell: bash
        run: |
          {
            grep -aE "✘|[0-9]+ (failed|flaky)|Error (name|value|message|source):|Unable to find|TestingLibraryElementError|expect\(received|Expected pattern|Received string| Timed out [0-9]+ms" /tmp/e2e.log \
              | grep -avE "\[WebServer\]|✓|Error Context|ECONNREFUSED|AggregateError" \
              | head -50
            echo "--- last failing frames ---"
            grep -aE "^\s+at .*\.(tsx?|jsx?):[0-9]+" /tmp/e2e.log | tail -20
          } | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
