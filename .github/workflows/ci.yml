name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Typecheck + Unit + Build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — нужен origin/main для guard «миграции 001–005 не изменялись»
      # в tests/integration/migrationsPostgres.test.ts. С дефолтным depth=1 checkout
      # не создаёт origin/main, и проверка сравнивать не с чем.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-e2e:
    name: Browser e2e (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e (capture output)
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Логи/артефакты недоступны из части сред — дублируем причину падения в аннотации
      # check-run (читаются через API без blob-хранилища).
      - name: Emit e2e failure details as annotations
        if: failure()
        shell: bash
        run: |
          grep -aE "✘|passed|failed|Error|Timed out|timed out|timeout|Error:" /tmp/e2e.log | tail -30 | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
