name: V3.4 product (core + server + mobile)

# Отдельный продукт `v34-app` тестируется отдельно от основного CRYPTORA:
# его parity-тесты читают ИСХОДНИКИ из `src/services/...` этого же репозитория,
# поэтому workflow намеренно запускается на КАЖДЫЙ pull request и на каждый push
# в main — БЕЗ фильтров по путям. Узкий `paths:` легко пропускает изменение,
# которое ломает parity (например, правку движка V3.4), и тогда «зелёный» PR
# врёт.
#
# Ограничения по доступу: только чтение репозитория, никаких секретов, никакой
# публикации APK/релизов. Debug-APK собирается отдельным workflow и релизом не
# является.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v34-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: core + server (test, typecheck, lint, build, release smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: v34-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v34-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (core)
        run: ./node_modules/.bin/tsc --noEmit -p packages/v34-core/tsconfig.json

      - name: Typecheck (server)
        run: ./node_modules/.bin/tsc --noEmit -p server/tsconfig.json

      - name: Unit + parity tests (core, server)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm test

      - name: Lint
        run: npx eslint .

      - name: Build server bundle
        run: npm run build

      # Не только «сборка прошла»: скрипт пакует архив и проверяет его
      # распаковкой, запуском сервера на временной БД, /api/v1/health и SIGTERM.
      - name: Package release archive and smoke-test it
        run: ./deploy/make-release.sh "$RUNNER_TEMP/release"

      - name: Upload release archive (artifact, не релиз)
        uses: actions/upload-artifact@v4
        with:
          name: v34-app-release-tarball
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: android client (typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v34-app/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v34-app/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Хвост вывода дублируется в summary check-run: без этого причина
      # падения jest в CI не видна (логи job'а недоступны из рабочего окружения).
      - name: Unit tests
        shell: bash
        run: |
          set +e
          npx jest --ci > /tmp/jest.log 2>&1
          status=$?
          tail -n 40 /tmp/jest.log
          if [ "$status" -ne 0 ]; then
            {
              echo "### Мобильные тесты упали"
              echo '```'
              tail -n 200 /tmp/jest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
