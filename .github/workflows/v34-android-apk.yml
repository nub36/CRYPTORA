name: V3.4 Android APK (check build)

# ВАЖНО: этот workflow собирает ПРОВЕРОЧНЫЙ (debug) APK, подписанный debug-ключом.
# Он не является релизной сборкой и не публикуется на лендинге как релиз.
# Релизная подпись требует keystore владельца в секретах репозитория
# (ANDROID_KEYSTORE_BASE64 и пароли) — до этого релизный APK собрать нельзя.
#
# Секретов в файле нет и быть не может.

# Минимальные права: сборка читает код и загружает артефакт, больше ничего.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - 'v34-app/mobile/**'
      - '.github/workflows/v34-android-apk.yml'

concurrency:
  group: v34-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: debug APK (unsigned release / debug key)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v34-app/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v34-app/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Вывод jest дублируется в summary check-run: логи job'а в этом окружении
      # иногда недоступны, а причина падения должна быть видна без них.
      - name: Unit tests
        shell: bash
        run: |
          set +e
          npx jest --ci > /tmp/jest.log 2>&1
          status=$?
          tail -n 40 /tmp/jest.log
          if [ "$status" -ne 0 ]; then
            {
              echo "### Мобильные тесты упали"
              echo '```'
              tail -n 200 /tmp/jest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Prebuild native Android project
        env:
          # Адрес сервера подставляется на этапе сборки. Для проверочной сборки
          # допустимо оставить пустым: приложение покажет «Сервер не настроен».
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.V34_API_BASE_URL }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v34-app-debug-apk
          path: v34-app/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Факты об APK печатаются и в summary, и в АННОТАЦИИ check-run: скачивание
      # артефактов и логи job'ов доступны не из любого окружения, а пакет, версия,
      # тип подписи, размер и SHA-256 должны быть проверяемыми через API.
      - name: Summary
        shell: bash
        run: |
          # Шаг не должен валить сборку из-за метаданных: любая ошибка чтения —
          # это предупреждение и «unknown», а не красный job.
          set +e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$APK")"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          BADGING=""
          if [ -n "$AAPT" ]; then BADGING="$("$AAPT" dump badging "$APK" 2>/dev/null | grep -m1 "^package:")"; fi
          PKG="$(printf '%s' "$BADGING" | sed -nE "s/.*package: name='([^']+)'.*/\1/p")"
          VNAME="$(printf '%s' "$BADGING" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")"
          VCODE="$(printf '%s' "$BADGING" | sed -nE "s/.*versionCode='([^']+)'.*/\1/p")"
          # apksigner берём из PATH или из build-tools; stderr сохраняем, чтобы
          # причина отсутствия подписи была видна в аннотации (пути/версии SDK
          # на раннерах различаются).
          if [ -z "$APKSIGNER" ]; then APKSIGNER="$(command -v apksigner)"; fi
          CERTS=""
          SIGN_RC=127
          if [ -n "$APKSIGNER" ]; then
            CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
            SIGN_RC=$?
          fi
          DN_LINE="$(printf '%s\n' "$CERTS" | grep -m1 '^Signer #1 certificate DN: ')"
          DN="${DN_LINE#Signer #1 certificate DN: }"
          SCHEMES="$(printf '%s\n' "$CERTS" | sed -n 's/^Verified using \(.*\): true$/\1/p' | paste -sd, -)"
          [ -n "$PKG" ] || PKG=unknown
          [ -n "$VNAME" ] || VNAME=unknown
          [ -n "$VCODE" ] || VCODE=unknown
          [ -n "$DN" ] || DN=unknown
          [ -n "$SCHEMES" ] || SCHEMES=unknown
          echo "APK sha256=$SHA size=${SIZE}B package=$PKG versionName=$VNAME versionCode=$VCODE signerDN=$DN schemes=$SCHEMES"
          echo "::notice title=APK::sha256=$SHA size=${SIZE}B"
          echo "::notice title=APK package::id=$PKG versionName=$VNAME versionCode=$VCODE"
          echo "::notice title=APK signature::signerDN=$DN schemes=$SCHEMES apksigner=${APKSIGNER:-none} rc=$SIGN_RC"
          if [ "$SIGN_RC" -ne 0 ]; then
            printf '%s\n' "$CERTS" | tail -n 5
          fi
          {
            echo "## CRYPTORA V3.4 — проверочная сборка"
            echo ""
            echo "- Это **debug** APK: подписан debug-ключом, **не релиз**."
            echo "- Релизная подпись требует keystore владельца (секреты CI) или EAS-профиля."
            echo ""
            echo "| Свойство | Значение |"
            echo "|---|---|"
            echo "| Package id | \`$PKG\` |"
            echo "| versionName | \`$VNAME\` |"
            echo "| versionCode | \`$VCODE\` |"
            echo "| Размер APK | \`$SIZE\` байт |"
            echo "| SHA-256 APK | \`$SHA\` |"
            echo "| Подпись | \`$DN\` |"
            echo "| Схемы подписи | \`$SCHEMES\` |"
            echo "| Коммит сборки | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
