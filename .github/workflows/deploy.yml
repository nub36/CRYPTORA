# CRYPTORA → GitHub Pages (статический SPA-терминал)
#
# Что деплоится: ТОЛЬКО фронтенд (dist/). Node-бэкенд server/ (Express + PostgreSQL:
# auth, AI-прокси) на GitHub Pages невозможен — страницы /login, /register, /admin
# и /api/* работают в режиме «гостя»: AuthContext честно показывает
# «Авторизация временно недоступна», рыночные данные идут напрямую из браузера
# к публичным API бирж (Binance/KuCoin/CoinGecko), как и в остальном приложении.
#
# Перед первым запуском: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# Триггер — ТОЛЬКО ручной запуск (workflow_dispatch).
# При интеграции v0.9.0 автотриггер push→main отключён: продакшен терминала — VPS
# (cryptora.duckdns.org), а GH Pages вырождает auth/AI в «гостевой» режим. Публикация
# на Pages — отдельное осознанное решение владельца (запуск вручную из вкладки Actions).

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (subpath /CRYPTORA/ + SPA-типизация tsc -b)
        run: npm run build
        env:
          # Имя репозитория → подкаталог https://nub36.github.io/CRYPTORA/.
          # При смене имени репозитория или кастомном домене поменять на '/'.
          GITHUB_BASE_PATH: /CRYPTORA/

      - name: SPA fallback + .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
