<!doctype html>
<html lang="ru" class="dark" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRYPTORA — Профессиональный информационно-аналитический криптовалютный терминал высокой плотности данных. Рынок. Данные. Решения." />
    <script>
      // Анти-FOUC: применяем сохранённую тему до загрузки бандла (логика зеркалит src/theme/theme.ts).
      (function () {
        try {
          var p = localStorage.getItem('cryptora_theme');
          if (p !== 'dark' && p !== 'light' && p !== 'system') p = 'system';
          var dark = p === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : p === 'dark';
          var r = document.documentElement;
          r.classList.remove('dark', 'light');
          r.classList.add(dark ? 'dark' : 'light');
          r.setAttribute('data-theme', p);
          r.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>CRYPTORA — Crypto Market Intelligence Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-root text-slate-200 antialiased selection:bg-brand-cyan/20 selection:text-brand-cyan min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
