# ==============================================================================
# CRYPTORA — Nginx Production Configuration
# Canonical domain: https://cryptonic.online (миграция домена 2026-10-05)
# ==============================================================================
# Целевая схема (финальное решение владельца):
#   http://cryptonic.online/*            → 301 → https://cryptonic.online/*
#   http://www.cryptonic.online/*        → 301 → https://cryptonic.online/*
#   http://cryptora.duckdns.org/*        → 301 → https://cryptonic.online/*
#   https://cryptonic.online/*           → приложение (этот файл, основной vhost)
#   https://www.cryptonic.online/*       → 301 → https://cryptonic.online/*
#   https://cryptora.duckdns.org/*       → 301 → https://cryptonic.online/* (legacy)
#
# Редиректы сохраняют path и query ($request_uri). Legacy-редирект DuckDNS
# требует действующего TLS-сертификата cryptora.duckdns.org — линейка certbot
# для него СОХРАНЯЕТСЯ вместе с автопродлением и НЕ удаляется.
#
# Приложение на VPS: /root/CRYPTORA (systemd WorkingDirectory); статику nginx
# раздаёт из /root/CRYPTORA/dist, /api/* проксирует на 127.0.0.1:3000
# (бэкенд слушает ТОЛЬКО loopback, порт 3000 наружу не открывается).
#
# Place in /etc/nginx/sites-available/cryptora.conf
# Enable: ln -s /etc/nginx/sites-available/cryptora.conf /etc/nginx/sites-enabled/
# Test: nginx -t     Reload: systemctl reload nginx
#
# ⚠️ ПЕРЕД применением снять и сохранить живой конфиг (`sudo nginx -T`).
#    Живая конфигурация может отличаться от шаблона (структура listen/http2,
#    имена зон, расположение блоков). limit_req_zone должна быть объявлена
#    РОВНО ОДИН раз на весь nginx — при переносе в существующий конфиг
#    НЕ дублировать уже объявленную зону.
# ==============================================================================

# Rate limiting zone for public market data requests (один раз на весь nginx!)
limit_req_zone $binary_remote_addr zone=cryptora_api:10m rate=30r/s;

# ------------------------------------------------------------------------------
# HTTP (порт 80): все три имени → https://cryptonic.online (path+query сохраняются)
# + webroot для ACME HTTP-01 challenge certbot'а (до редиректа).
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cryptonic.online www.cryptonic.online cryptora.duckdns.org;

    # Let's Encrypt ACME challenge (certonly --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://cryptonic.online$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS: canonical cryptonic.online — ПОЛНЫЙ application vhost
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cryptonic.online;

    # Сертификат: cryptonic.online + www.cryptonic.online (одна линейка, оба SAN)
    ssl_certificate /etc/letsencrypt/live/cryptonic.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptonic.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (per-hostname: только cryptonic.online; legacy-хост не затронут)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    root /root/CRYPTORA/dist;
    index index.html;

    # Production Logging
    access_log /var/log/nginx/cryptora_access.log combined;
    error_log /var/log/nginx/cryptora_error.log warn;

    # Disable directory listing
    autoindex off;

    # Client payload limit (minimal since CRYPTORA is read-only analytics)
    client_max_body_size 2M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://stream.binance.com:9443 wss://fstream.binance.com wss://stream.bybit.com wss://ws.okx.com:8443 https://www.okx.com https://api.alternative.me https://api.llama.fi https://mempool.space https://api.coingecko.com https://api.telegram.org https://telegram.org; frame-src 'self' https://oauth.telegram.org; frame-ancestors 'self';" always;

    # Static Assets Caching (Vite hashes assets in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Favicon / Robots / Sitemap
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Market Data Gateway / Health API Proxy (Forward to local Node service)
    location /api/ {
        limit_req zone=cryptora_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # SPA Routing: Any non-file path falls back to index.html with no-cache headers
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

# ------------------------------------------------------------------------------
# HTTPS: www.cryptonic.online — ТОЛЬКО постоянный редирект на canonical
# (path+query сохраняются; приложение и allowlist'ы www не обслуживают)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cryptonic.online;

    # Та же линейка сертификата (SAN включает www)
    ssl_certificate /etc/letsencrypt/live/cryptonic.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptonic.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://cryptonic.online$request_uri;
}

# ------------------------------------------------------------------------------
# HTTPS: legacy cryptora.duckdns.org — ТОЛЬКО постоянный редирект на canonical.
# Сертификат DuckDNS СОХРАНЯЕТСЯ (HTTPS-редирект требует валидного TLS) вместе
# с его certbot-renewal. Приложение по этому имени больше не обслуживается.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cryptora.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/cryptora.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptora.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://cryptonic.online$request_uri;
}
