# ==============================================================================
# CRYPTORA — Nginx Production Virtual Host Configuration
# ==============================================================================
# Place in /etc/nginx/sites-available/cryptora.conf
# Enable: ln -s /etc/nginx/sites-available/cryptora.conf /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx
# ==============================================================================

# Rate limiting zone for public market data requests
limit_req_zone $binary_remote_addr zone=cryptora_api:10m rate=30r/s;

# ------------------------------------------------------------------------------
# HTTP Server (Redirect to HTTPS or serve directly if no domain/SSL yet)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with actual production domain (e.g., cryptora.app)

    # Let's Encrypt ACME challenge location for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS once certificate is installed:
    # return 301 https://$host$request_uri;

    # --------------------------------------------------------------------------
    # Standalone HTTP configuration (used when deploying via VPS IP or before SSL)
    # --------------------------------------------------------------------------
    root /home/user/CRYPTORA/dist;
    index index.html;

    # Production Logging
    access_log /var/log/nginx/cryptora_access.log combined;
    error_log /var/log/nginx/cryptora_error.log warn;

    # Disable directory listing
    autoindex off;

    # Client payload limit (minimal since CRYPTORA is read-only analytics)
    client_max_body_size 2M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.binance.com https://fapi.binance.com https://api.kucoin.com wss://stream.binance.com:9443 wss://fstream.binance.com wss://stream.bybit.com wss://ws.okx.com:8443 https://www.okx.com https://api.alternative.me https://api.llama.fi https://mempool.space https://api.coingecko.com https://api.telegram.org; frame-ancestors 'self';" always;

    # Static Assets Caching (Vite hashes assets in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Favicon & Robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Market Data Gateway / Health API Proxy (Forward to local Node service)
    location /api/ {
        limit_req zone=cryptora_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # SPA Routing: Any non-file path falls back to index.html with no-cache headers
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

